openapi: 3.0.0
info:
  title: HookSight API
  description: API for managing webhooks, endpoints, projects, and workspaces.
  version: 1.0.0
servers:
  - url: http://localhost:3001/api
    description: Local development server
paths:
  /auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
  /webhooks/{endpointId}:
    post:
      summary: Ingest a webhook
      parameters:
        - in: path
          name: endpointId
          required: true
          schema:
            type: string
      security:
        - ApiKeyAuth: []
      responses:
        '202':
          description: Webhook received
  /events/project/{projectId}:
    get:
      summary: Get events for a project
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: string
        - in: query
          name: endpointId
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      security:
        - BearerAuth: []
      responses:
        '200':
          description: A list of events
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: API Key prefixed with hk_test_
