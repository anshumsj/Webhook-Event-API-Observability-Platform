version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: hooksight_mongodb
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27018:27017" # Exposed for regression testing from host
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hooksight_redis
    ports:
      - "6380:6379" # Exposed on 6380 for regression testing from host to avoid local clash
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./
      dockerfile: backend/Dockerfile
    container_name: hooksight_backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - MONGODB_URI=mongodb://mongodb:27017/webhookObservability
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-insecure_dev_secret_please_change_in_production}
      - ALLOWED_ORIGINS=http://localhost:8080,http://localhost:5173
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "--header=Origin: http://localhost:8080", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:3001/api
    container_name: hooksight_frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongodb_data:
